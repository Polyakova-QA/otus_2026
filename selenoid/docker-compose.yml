services:
  selenoid1:
    image: aerokube/selenoid:1.11.3
    container_name: selenoid1
    hostname: selenoid1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./browsers.json:/etc/selenoid/browsers.json:ro
    environment:
      DOCKER_API_VERSION: "1.44"
    command: -limit 2 -container-network selenoid1
    networks:
      - selenoid1

  selenoid2:
    image: aerokube/selenoid:1.11.3
    container_name: selenoid2
    hostname: selenoid2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./browsers.json:/etc/selenoid/browsers.json:ro
    environment:
      DOCKER_API_VERSION: "1.44"
    command: -limit 2 -container-network selenoid2
    networks:
      - selenoid2

  ggr:
    image: aerokube/ggr:latest
    container_name: ggr
    hostname: ggr
    ports:
      - "4444:4444"
    volumes:
      - ./quota:/etc/grid-router/quota:ro

    command: -listen :4444 -guests-allowed -guests-quota test
    depends_on:
      - selenoid1
      - selenoid2
    networks:
      - selenoid1
      - selenoid2

  ggr-ui:
    image: aerokube/ggr-ui:latest
    container_name: ggr-ui
    hostname: ggr-ui
    volumes:
      - ./quota:/etc/grid-router/quota:ro
    depends_on:
      - selenoid1
      - selenoid2
    networks:
      - selenoid1
      - selenoid2

  selenoid-ui:
    image: aerokube/selenoid-ui:1.10.11
    container_name: selenoid-ui
    hostname: selenoid-ui
    ports:
      - "8090:8080"
    command: --selenoid-uri http://ggr-ui:8888
    depends_on:
      - ggr-ui
    networks:
      - selenoid1

networks:
  selenoid1:
    name: selenoid1
    external: true
  selenoid2:
    name: selenoid2
    external: true